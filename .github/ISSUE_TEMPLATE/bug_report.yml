name: Bug report
description: Report a reproducible problem using synthetic/private-safe details.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, Sheet URLs, account/campaign IDs or names,
        customer/company data, production logs, or screenshots. Use synthetic
        values and masked identifiers only. Security issues belong in private
        vulnerability reporting, not a public Issue.
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: 2.2.0
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Control Panel
        - Orchestrator / Trigger
        - Meta
        - TikTok
        - Google Ads
        - Apple Search Ads
        - Moloco
        - Data / Dashboard / QA
        - Documentation
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Sanitized description
      description: Include status/error codes and counts only; no production data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction using synthetic values
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, IDs, names, URLs, logs, and customer/company data.
          required: true

